  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const formatTalkLocations = () => {
        document
          .querySelectorAll("#talks a.group > div.flex-1 > p")
          .forEach((metadata) => {
            if (metadata.textContent.includes(" · ")) {
              metadata.textContent = metadata.textContent.replaceAll(
                " · ",
                " - ",
              );
            }
          });
      };

      const observer = new MutationObserver(formatTalkLocations);
      observer.observe(document.body, { childList: true, subtree: true });
      formatTalkLocations();
    });
  </script>
