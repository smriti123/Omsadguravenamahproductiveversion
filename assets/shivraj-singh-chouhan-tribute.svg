  <text x="86" y="270" fill="#55acee" font-family="Arial, Helvetica, sans-serif" font-size="31">Show translation</text>

  <g fill="#2d3740" font-family="Noto Serif Devanagari, Mangal, Arial, sans-serif" font-size="35" font-weight="400">
    <text x="33" y="333">वेदांत के निष्णात विद्वान, सिद्धबाड़ी आश्रम चिन्मय मिशन के प्रमुख, स्वामी चिन्मयानंद जी</text>
    <text x="33" y="388">के प्रिय शिष्य, पूज्य स्वामी सुबोधानंद सरस्वती जी आज ब्रह्मलीन हो गये।</text>
    <text x="33" y="485">उनकी शिक्षाएं सर्वदा मानवता का कल्याण करती रहेंगी।</text>
    <text x="33" y="540">आध्यात्मिक जगत के दिव्य सूर्य के चरणों में श्रद्धांजलि।</text>
  </g>

  <text x="33" y="632" fill="#6f7b84" font-family="Arial, Helvetica, sans-serif" font-size="31">7:30 AM · Sep 27, 2020</text>
