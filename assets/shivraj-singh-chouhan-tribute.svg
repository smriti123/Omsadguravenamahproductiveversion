  <text x="1277" y="143" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700">...</text>

  <g transform="translate(39 247)">
    <path d="M22 2c-14 13-18 29-12 45 13-10 24-23 31-39" fill="none" stroke="#71777e" stroke-width="4" stroke-linecap="round"/>
