  <title id="title">Shivraj Singh Chouhan tribute post for Pujya Swami Subodhananda Saraswati ji</title>
  <desc id="desc">A screenshot-style tribute post in Hindi dated 7:30 AM, Sep 27, 2020.</desc>
  <rect width="1366" height="682" fill="#ffffff"/>
  <rect y="680" width="1366" height="2" fill="#e7e7e7"/>

